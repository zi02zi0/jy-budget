/* Layout: a Notion page — soft cover band, page icon + big title, sticky database toolbar (view tabs · month · 새로 만들기), blocks below; editing opens a side peek (bottom sheet on phones). */
:root{
  --bg:#FFFFFF; --text:rgb(55,53,47); --text2:rgba(55,53,47,.65); --text3:rgba(55,53,47,.45);
  --line:rgba(55,53,47,.09); --line2:rgba(55,53,47,.16); --hover:rgba(55,53,47,.06); --side:#F7F7F5; --panel:#FFFFFF;
  --blue:rgb(35,131,226); --blue-h:rgb(0,117,211); --red-t:rgb(212,76,71); --green-t:rgb(68,131,97); --blue-t:rgb(51,126,169);
  --cover1:#DCE8D9; --cover2:#B9D3B3; --cover3:#EEF3E6;
  --tg-gray:rgb(227,226,224); --tg-gray-t:rgb(50,48,44);
  --tg-brown:rgb(238,224,218); --tg-brown-t:rgb(68,42,30);
  --tg-orange:rgb(250,222,201); --tg-orange-t:rgb(73,41,14);
  --tg-yellow:rgb(253,236,200); --tg-yellow-t:rgb(64,44,27);
  --tg-green:rgb(219,237,219); --tg-green-t:rgb(28,56,41);
  --tg-blue:rgb(211,229,239); --tg-blue-t:rgb(24,51,71);
  --tg-purple:rgb(232,222,238); --tg-purple-t:rgb(65,36,84);
  --tg-pink:rgb(245,224,233); --tg-pink-t:rgb(76,35,55);
  --tg-red:rgb(255,226,221); --tg-red-t:rgb(93,23,21);
  --font:"Pretendard Variable",Pretendard,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Helvetica,sans-serif,"Apple Color Emoji","Segoe UI Emoji";
  --shadow:rgba(15,15,15,.05) 0 0 0 1px,rgba(15,15,15,.1) 0 3px 6px,rgba(15,15,15,.2) 0 9px 24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191919; --text:rgba(255,255,255,.81); --text2:rgba(255,255,255,.46); --text3:rgba(255,255,255,.3);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14); --hover:rgba(255,255,255,.055); --side:#202020; --panel:#252525;
  --blue:rgb(35,131,226); --blue-h:rgb(62,148,233); --red-t:rgb(230,91,82); --green-t:rgb(82,158,114); --blue-t:rgb(82,156,202);
  --cover1:#24332A; --cover2:#2E4535; --cover3:#1F2622;
  --tg-gray:rgb(55,55,55); --tg-gray-t:rgba(255,255,255,.85); --tg-brown:rgb(74,50,40); --tg-brown-t:rgba(255,255,255,.85);
  --tg-orange:rgb(92,59,35); --tg-orange-t:rgba(255,255,255,.85); --tg-yellow:rgb(86,67,40); --tg-yellow-t:rgba(255,255,255,.85);
  --tg-green:rgb(36,61,48); --tg-green-t:rgba(255,255,255,.85); --tg-blue:rgb(20,58,78); --tg-blue-t:rgba(255,255,255,.85);
  --tg-purple:rgb(60,45,73); --tg-purple-t:rgba(255,255,255,.85); --tg-pink:rgb(78,44,60); --tg-pink-t:rgba(255,255,255,.85);
  --tg-red:rgb(82,46,42); --tg-red-t:rgba(255,255,255,.85);
  --shadow:rgba(15,15,15,.1) 0 0 0 1px,rgba(15,15,15,.2) 0 3px 6px,rgba(15,15,15,.4) 0 9px 24px; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919; --text:rgba(255,255,255,.81); --text2:rgba(255,255,255,.46); --text3:rgba(255,255,255,.3);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14); --hover:rgba(255,255,255,.055); --side:#202020; --panel:#252525;
  --blue:rgb(35,131,226); --blue-h:rgb(62,148,233); --red-t:rgb(230,91,82); --green-t:rgb(82,158,114); --blue-t:rgb(82,156,202);
  --cover1:#24332A; --cover2:#2E4535; --cover3:#1F2622;
  --tg-gray:rgb(55,55,55); --tg-gray-t:rgba(255,255,255,.85); --tg-brown:rgb(74,50,40); --tg-brown-t:rgba(255,255,255,.85);
  --tg-orange:rgb(92,59,35); --tg-orange-t:rgba(255,255,255,.85); --tg-yellow:rgb(86,67,40); --tg-yellow-t:rgba(255,255,255,.85);
  --tg-green:rgb(36,61,48); --tg-green-t:rgba(255,255,255,.85); --tg-blue:rgb(20,58,78); --tg-blue-t:rgba(255,255,255,.85);

  --tg-red:rgb(82,46,42); --tg-red-t:rgba(255,255,255,.85);

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
body{padding-inline:0;padding-block:0 80px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid rgba(35,131,226,.6);outline-offset:1px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text2)} .faint{color:var(--text3)}
.c-inc{color:var(--blue-t)} .c-save{color:var(--green-t)} .c-warn{color:var(--red-t)} .c-move{color:var(--text2)}

/* page header */
.cover{height:clamp(120px,22vw,200px);background:
  radial-gradient(120% 140% at 85% 10%,var(--cover2) 0%,transparent 55%),
  radial-gradient(90% 120% at 10% 90%,var(--cover1) 0%,transparent 60%),
  linear-gradient(135deg,var(--cover3),var(--cover1))}
.page{max-width:1480px;margin:0 auto;padding-inline:clamp(16px,4vw,56px)}
.page-icon{width:78px;height:78px;margin-top:-40px;display:grid;place-items:center}
.page-icon svg{width:72px;height:72px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
h1.title{font-size:clamp(30px,5vw,40px);font-weight:700;line-height:1.2;margin:clamp(28px,6vw,64px) 0 2px;letter-spacing:-.01em}
.subtitle{color:var(--text2);margin:0 0 8px}

/* database toolbar */
.dbbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:6px;margin-top:10px}
.views{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.views::-webkit-scrollbar{display:none}
.views button{border:0;background:none;color:var(--text2);padding:6px 8px 8px;border-radius:0;display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.views button:hover{color:var(--text)}
.views button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.views svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.dbtools{display:flex;align-items:center;gap:6px;padding-bottom:6px;margin-left:auto}
.month{display:flex;align-items:center;gap:0}
.ghost{border:0;background:none;border-radius:4px;padding:4px 7px;color:var(--text2)}
.ghost:hover{background:var(--hover);color:var(--text)}
.month select{border:0;background:none;padding:4px 6px;border-radius:4px;appearance:none;-webkit-appearance:none;font-weight:500;color:var(--text)}
.month select:hover{background:var(--hover)}
.status{font-size:12px;color:var(--text3);white-space:nowrap}
.status.err{color:var(--red-t)}
.newbtn{display:flex;align-items:center;border-radius:4px;background:var(--blue);color:#fff;border:0;padding:5px 10px;font-weight:500;white-space:nowrap}
.newbtn:hover{background:var(--blue-h)}
.subbtn{display:flex;align-items:center;border-radius:4px;background:none;color:var(--text);border:0;box-shadow:inset 0 0 0 1px var(--line2);padding:5px 10px;font-weight:500;white-space:nowrap}
.subbtn:hover{background:var(--hover)}

main{padding-top:24px;display:grid;gap:36px}
h2.blk{font-size:15px;font-weight:600;color:var(--text2);margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
h2.blk .emo{font-size:16px}
.blk-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.blk-h h2.blk{margin:0}
.cols{display:grid;gap:36px;grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}

/* gallery cards (Notion gallery view) */
.gallery{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
.gcard{border-radius:6px;box-shadow:rgba(15,15,15,.06) 0 0 0 1px,rgba(15,15,15,.06) 0 2px 4px;background:var(--bg);padding:12px 14px;text-align:left;border:0;display:grid;gap:4px;min-width:0}
:root[data-theme="dark"] .gcard{background:var(--panel)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gcard{background:var(--panel)}}
button.gcard:hover{background:var(--hover)}
.gcard .lb{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:500;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gcard .v{font-size:20px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
(()=>{
"use strict";
/* ---------- state ---------- */
const S={db:null, months:{}, cats:[], wallets:[], fixed:[], stats:[], routines:[], settings:{food:{},foodDefault:0,groups:[]},
  loaded:{tx:false,meta:false}, tab:'home', ym:null, groupScope:'month',
  sel:new Set(), q:'', fCat:'', fWal:'', fDay:'', fAll:false, limit:150, writable:true};
const IC={
  home:'<path d="M3 8.5 10 3l7 5.5V17H3z"/><path d="M8 17v-5h4v5"/>',
  list:'<rect x="3" y="3.5" width="14" height="13" rx="1.5"/><path d="M3 8h14M3 12h14M8 3.5v13"/>',
  wallet:'<rect x="2.5" y="5" width="15" height="11" rx="1.5"/><path d="M2.5 8h15M13 12h2"/>',
  cat:'<path d="M3 5.5h5l1.5 2H17v8.5H3z"/>',
  fixed:'<circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 2"/>',
  stats:'<path d="M4 16V9M8.5 16V5M13 16v-5M17 16H3"/>',
  backup:'<path d="M10 3v9M6.5 8.5 10 12l3.5-3.5M4 15.5h12"/>',
  routine:'<path d="M4 9a6 6 0 0 1 10.5-4M16 11a6 6 0 0 1-10.5 4"/><path d="M14.5 2v3h-3M5.5 18v-3h3"/>'};
const TABS=[['home','홈'],['list','내역'],['routine','루틴'],['wallet','지갑'],['cat','카테고리'],['stats','통계'],['backup','백업']];
try{const t=localStorage.getItem('gb.tab'); if(t&&TABS.some(x=>x[0]===t)) S.tab=t;}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wonS=(n,sign)=>{ if(n==null||isNaN(n)) return '–'; const v=Math.round(n); const s=Math.abs(v).toLocaleString('ko-KR'); if(v<0) return '-'+s; return (sign&&v>0?'+':'')+s; };
/* 사용 금액은 부호 없이 표시 (저장값은 Notion처럼 지출 음수 그대로) */
const won=n=>(n==null||isNaN(n))?'–':wonS(Math.abs(n));
const txAmt=x=>{const ty=typeOf(x); return (ty!=='수입'&&x.amt>0)?'+'+won(x.amt):(ty==='수입'&&x.amt<0)?'-'+won(x.amt):won(x.amt);};
const todayStr=()=>{const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const ymOf=d=>d.slice(0,7);
const ymLabel=ym=>{const [y,m]=ym.split('-'); return `${y}년 ${+m}월`;};
const addMonths=(ym,k)=>{let [y,m]=ym.split('-').map(Number); m+=k; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+'-'+String(m).padStart(2,'0');};
const daysIn=ym=>{const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate();};
const addMonthsDate=(d,k)=>{const ym=addMonths(d.slice(0,7),k); const day=Math.min(+d.slice(8,10),daysIn(ym)); return ym+'-'+String(day).padStart(2,'0');};
const dot=d=>d.replace(/-/g,'/');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const catById=id=>S.cats.find(c=>c.id===id);
const walById=id=>S.wallets.find(w=>w.id===id);
const typeOf=t=>t.kind==='이체'?'이체':(catById(t.cat)?.type||'지출');
const isX=t=>t.kind==='이체';
const acct=t=>t.bm||ymOf(t.date);
const allTx=()=>{const a=[]; for(const k of Object.keys(S.months).sort()) for(const t of S.months[k]) a.push(t); return a;};
const monthTx=ym=>allTx().filter(t=>acct(t)===ym);
/* Notion-style tag colors: 분류 uses the CATEGORY 태그 colors from Notion; each category gets its own color */
const TYPE_COLOR={수입:'red',지출:'purple',송금:'gray',저축:'green'};
const PALETTE=['blue','green','orange','pink','purple','yellow','brown','red','gray'];
const catColor=c=> c? (c.color||PALETTE[(c.order??0)%PALETTE.length]) : 'gray';
const catTag=c=>`<span class="tag t-${catColor(c)}">${esc(c?.name||'미분류')}</span>`;
const typeTag=ty=>`<span class="tag t-${TYPE_COLOR[ty]||'gray'}">${ty}</span>`;
const docIc='<svg class="doc" viewBox="0 0 16 16"><path d="M4 1.8h5.2L12.5 5v9.2H4z"/><path d="M9 1.8V5h3.5"/></svg>';

/* ---------- Notion formulas, as code ---------- */
// 월납입금: 원리금균등 상환, 개월수별 할부 수수료율 (Notion 수식 그대로)
const aprFor=n=> n===2?15.9: n===3?17.9: (n===4||n===5)?19.5: (n>=6&&n<=9)?19.6: (n>=10&&n<=18)?19.7: (n>=19&&n<=24)?19.8: 0;
function installment(P,n,free){
  P=Math.abs(+P||0); n=+n||0; if(!P||n<=0) return null;
  const apr=free?0:aprFor(n), r=apr/100/12;
  const pay=Math.round(r===0? P/n : P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1));
  return {apr, monthly:pay, interest:Math.round(pay*n-P)};
}
/* 모임통장(group): 다른 사람 돈이 섞인 통장 · 그 안에서 들어오고 나간 돈은 내 수입·지출·식비에서 빼요 (잔액은 그대로 계산) */
const isGroupW=id=>!!walById(id)?.group;
const mine=t=> isX(t) || !isGroupW(t.wallet);
function totals(list){
  const o={수입:0,지출:0,저축:0,송금:0,이체:0,food:0};
  for(const t of list){ if(!mine(t)) continue; o[typeOf(t)]+=t.amt; if(catById(t.cat)?.food) o.food+=Math.abs(t.amt);
    if(isX(t)){ const sv=!!walById(t.to)?.saving, sf=!!walById(t.wallet)?.saving; if(sv&&!sf) o.저축+=t.amt; } } // 저축 통장으로 보낸 이체 = 저축 (만기로 빼는 건 제외)
  o.정산=o.수입+o.지출+o.송금; return o;
}
function foodPlan(ym){
  const budget=S.settings.food?.[ym] ?? S.settings.foodDefault ?? 0;
  const used=totals(monthTx(ym)).food; const left=budget-used;
  const today=todayStr(), cur=ymOf(today);
  const daysLeft = ym<cur?0 : ym>cur? daysIn(ym) : daysIn(ym)-(+today.slice(8,10));
  const perMeal = daysLeft>0? Math.round(left/(daysLeft*3)) : null;
  return {budget,used,left,daysLeft,perMeal, set: S.settings.food?.[ym]!=null};
}
function mealVerdict(t, plan){ // 오늘의 식비 평가
  if(!catById(t.cat)?.food || plan.perMeal==null) return null;
  const v=Math.abs(t.amt);
  if(plan.perMeal>v) return '잘했어요 😆';
  if(plan.perMeal===v) return '정확해요 😎';
  return '다음달 식비까지 끌어 쓸거예요 😱';
}

/* ---------- 루틴: 매달 반복 초안 ---------- */
const normName=n=>String(n||'').replace(/\(\d+\/\d+\)/g,'').replace(/\s+/g,'').toLowerCase();
function latestOf(r, beforeYm){ let best=null; for(const t of allTx()){ if(t.date.slice(0,7)>=beforeYm) continue; if(t.rid===r.id || normName(t.name)===normName(r.name)){ if(!best||t.date>best.date) best=t; } } return best; }
function cardUse(w,ym){ let s=0; for(const t of S.months[ym]||[]) if(t.wallet===w.id && !isX(t) && ymOf(t.date)===ym) s+= -t.amt - ptWon(t); return Math.max(0,Math.round(s)); }
/* 한국 공휴일 (대체공휴일 포함) · 주말·공휴일이면 루틴 날짜를 앞당기거나 미뤄요 */
const KR_HOLI=new Set(['2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-03-02','2026-05-05','2026-05-24','2026-05-25','2026-06-03','2026-06-06','2026-08-15','2026-08-17','2026-09-24','2026-09-25','2026-09-26','2026-09-28','2026-10-03','2026-10-05','2026-10-09','2026-12-25',
 '2027-01-01','2027-02-06','2027-02-07','2027-02-08','2027-02-09','2027-03-01','2027-05-05','2027-05-13','2027-06-06','2027-08-15','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-03','2027-10-04','2027-10-09','2027-10-11','2027-12-25','2027-12-27']);
const isOff=ds=>{ const w=new Date(ds+'T00:00:00Z').getUTCDay(); return w===0||w===6||KR_HOLI.has(ds); };
function bizDay(ym,d,mode){ if(!mode) return d; const n=daysIn(ym), f=x=>`${ym}-${String(x).padStart(2,'0')}`; let x=d, step=mode==='prev'?-1:1;
  while(x>=1&&x<=n&&isOff(f(x))) x+=step; if(x<1||x>n){ x=d; step=-step; while(x>=1&&x<=n&&isOff(f(x))) x+=step; if(x<1||x>n) x=d; } return x; }
/* ---------- 외화 ---------- 환율은 같은 통화의 지난 실제 결제(원화 ÷ 외화)에서 배워요 · 기록이 없으면 기본값 */
const CURS=[['KRW','₩','원화'],['USD','$','달러'],['JPY','¥','엔'],['EUR','€','유로'],['CNY','元','위안'],['GBP','£','파운드']];
const FX_DEFAULT={USD:1400,JPY:9.5,EUR:1500,CNY:195,GBP:1800};
const curSym=c=>(CURS.find(x=>x[0]===c)||[0,c])[1];
const fmtFx=(c,v)=>curSym(c)+(+v).toLocaleString('en-US',{maximumFractionDigits:2});
function fxRate(cur,excludeId){ let best=null; for(const t of allTx()){ if(t.cur===cur && +t.fx>0 && t.amt && t.id!==excludeId && (!best || t.date>best.date || (t.date===best.date&&(t.ts||0)>(best.ts||0)))) best=t; }
  return best? Math.abs(best.amt)/(+best.fx) : (+S.settings.fx?.[cur] || FX_DEFAULT[cur] || 1); }
const rateTxt=r=> r>=100? Math.round(r*10)/10 : Math.round(r*100)/100;
const fxRow=(px,cur,fx,rate)=>`<div class="prop" id="${px}-fxrow"><label for="${px}-cur"><span class="pi">💱</span>통화</label><div class="fx-in"><select id="${px}-cur">${CURS.map(([c,sy,nm])=>`<option value="${c}" ${c===(cur||'KRW')?'selected':''}>${sy} ${nm}</option>`).join('')}</select>
  <span class="fx-more" ${cur&&cur!=='KRW'?'':'hidden'}><input id="${px}-fx" class="num" inputmode="decimal" value="${fx||''}" placeholder="외화 금액"><span class="faint">×</span><input id="${px}-rate" class="num" inputmode="decimal" value="${rate?rateTxt(rate):''}" placeholder="환율"><span class="faint">원</span></span></div></div>`;
function wireFx(s,px,excludeId){ const q=x=>s.querySelector(x); const sel=q('#'+px+'-cur'), more=s.querySelector('#'+px+'-fxrow .fx-more'), fx=q('#'+px+'-fx'), rt=q('#'+px+'-rate'), amt=q('#'+px+'-amt');
  const calc=()=>{ const c=sel.value; if(c==='KRW') return; const f=parseFloat(String(fx.value).replace(/,/g,''))||0, r=parseFloat(String(rt.value).replace(/,/g,''))||0; if(f>0&&r>0){ amt.value=Math.round(f*r).toLocaleString('ko-KR'); amt.dispatchEvent(new Event('input',{bubbles:true})); } };
  sel.addEventListener('change',()=>{ const c=sel.value; more.hidden=c==='KRW'; if(c!=='KRW'){ rt.value=rateTxt(fxRate(c,excludeId)); calc(); fx.focus(); } });
  fx.addEventListener('input',calc); rt.addEventListener('input',calc);
  amt.addEventListener('change',()=>{ if(sel.value==='KRW') return; const f=parseFloat(String(fx.value).replace(/,/g,''))||0, a=Math.abs(num(amt.value)); if(f>0&&a>0) rt.value=rateTxt(a/f); });
  return ()=> sel.value==='KRW'? null : {cur:sel.value, fx:parseFloat(String(fx.value).replace(/,/g,''))||0}; }
const LIVE_FROM='2026-10'; // 이 달부터 실제로 쓰기 시작 · 그 전 달에는 루틴 초안을 만들지 않아요
function routineDrafts(ym){
  if(ym<LIVE_FROM) return [];
  const out=[]; const mtx=S.months[ym]||[];
  for(const r of S.routines){
    if(r.paused) continue; if(r.freq==='year' && +ym.slice(5)!==(+r.month||1)) continue; if(r.start && ym<r.start) continue; if(r.end && ym>r.end) continue; if((r.skips||[]).includes(ym)) continue;
    if(mtx.some(t=>(t.rid===r.id && t.rym===ym) || normName(t.name)===normName(r.name))) continue;
    const day=bizDay(ym,Math.min(+r.day||1,daysIn(ym)),r.biz);
    let amt=r.amt, cmemo=''; if(r.vary){ const l=latestOf(r,ym); if(l) amt=l.amt; }
    if(r.cur && +r.fx>0){ const rate=fxRate(r.cur); amt=(r.amt<0?-1:1)*Math.round(r.fx*rate); cmemo=`${fmtFx(r.cur,r.fx)} (${curSym(r.cur)}1 = ${rateTxt(rate).toLocaleString('ko-KR')}원, 지난 결제 환율 기준)`; }
    if(r.kind==='이체'){ const tw=walById(r.to); if(walKind(tw)==='card'){ const cur=ymOf(todayStr());
      // 카드대금 초안 = 결제달 바로 전 달에 그 카드로 쓴 금액 (이번 달 결제는 남은 결제 예정액, 다음 달 결제는 이번 달 지금까지 쓴 누적액)
      if(ym===cur){ const inf=cardInfo(tw); if(inf.due>0){ amt=-inf.due; cmemo=`${+addMonths(ym,-1).slice(5)}월 사용분 결제 예정액`; } else { const u=cardUse(tw,addMonths(ym,-1)); if(u>0) amt=-u; } }
      else { const src=addMonths(ym,-1)<=cur? addMonths(ym,-1) : cur; const u=cardUse(tw,src); if(u>0){ amt=-u; cmemo=`${+src.slice(5)}월 ${tw.name} 사용 누적${src===cur?' (지금까지 · 내역을 적을 때마다 바뀌어요)':''}${src!==addMonths(ym,-1)?' · 예상치':''}`; } } } }
    out.push({draft:true,id:'d_'+r.id+'_'+ym,rid:r.id,rym:ym,name:r.name,date:`${ym}-${String(day).padStart(2,'0')}`,amt,cat:r.kind==='이체'?'':r.cat,wallet:r.wallet||'',to:r.to||'',kind:r.kind==='이체'?'이체':undefined,memo:r.memo||'',vary:!!r.vary,hint:cmemo,...(r.cur&&+r.fx>0?{cur:r.cur,fx:r.fx}:{})});
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
const saveRoutines=()=>saveMeta('recurring',{items:S.routines});
const findDraft=key=>{ const [rid,ym]=key.split('|'); return routineDrafts(ym).find(d=>d.rid===rid); };

/* ---------- 지갑 잔액 자동 계산 ----------
   지갑마다 기준 잔액(balance)과 기준 시점(baseDate, baseTs)을 두고,
   그 뒤에 일어난 내역(결제일이 기준일 이후 ~ 오늘)만 더하고 빼요.
   통장·현금·마통: 잔액 += 금액 / 카드·대출: 갚을 돈(양수) -= 금액 */
const PT_RATE=()=>+(S.settings.pointRate||1.5);  // M포인트: 1.5P = 1원
const ptWon=t=>t.pts? Math.round(t.pts/PT_RATE()) : 0;
function walKind(w){ if(!w) return 'normal'; if(w.kind) return w.kind; if(w.limit!=null) return 'od'; if(/카드/.test(w.name||'')) return 'card'; return 'normal'; }
const owes=w=>['card','loan'].includes(walKind(w));
function counted(w,t){ const d=t.date; if(!w.baseDate || d>todayStr()) return false; if(d>w.baseDate) return true; return d===w.baseDate && (t.ts||0)>(w.baseTs||0); }
function cardInfo(w){
  // 카드: '아직 안 갚은 사용분 시작 달(since)'부터 이번 달까지의 카드 사용 − 그 다음 달부터 카드로 이체한 결제 + 보정값
  const today=todayStr(), cur=ymOf(today), prev=addMonths(cur,-1), since=w.since||cur, payFrom=addMonths(since,1)+'-01';
  let charges=0, curUse=0, prevUse=0, pays=0, n=0;
  for(const t of allTx()){
    if(t.wallet===w.id){ const ym=t.date.slice(0,7); if(ym>=since && ym<=cur){ const v=-t.amt-ptWon(t); charges+=v; n++; if(ym===cur) curUse+=v; else if(ym===prev) prevUse+=v; } }
    if(isX(t) && t.to===w.id && t.date>=payFrom && t.date<=today){ pays+=Math.abs(t.amt); n++; }
  }
  const owed=charges-pays+(w.adj||0);
  return {bal:owed, curUse, prevUse, due:Math.max(0,owed-curUse), carry:Math.max(0,owed-curUse-prevUse), n, card:true};
}
function walInfo(w){
  if(walKind(w)==='card') return cardInfo(w);
  if(w.holdings?.length && walGroup(w)==='투자'){ const h=holdSum(w); return {bal:h.value+h.cash, n:0, hold:true}; }
  if(w.balance==null) return {bal:null};
  const ow=owes(w); let b=w.balance, carry=null, lastPay=null; const ev=[];
  for(const t of allTx()){ if(t.ptWallet===w.id && t.pts && counted(w,t)) ev.push([t, -t.pts, false]); if(t.wallet===w.id && counted(w,t)) ev.push([t, ow? -t.amt-ptWon(t) : t.amt+ptWon(t), false]); if(isX(t) && t.to===w.id && counted(w,t)) ev.push([t, ow? -Math.abs(t.amt) : Math.abs(t.amt), true]); }
  ev.sort((a,b)=>a[0].date.localeCompare(b[0].date)||(a[0].ts||0)-(b[0].ts||0));
  for(const [t,dl,inc] of ev){ b+=dl; if(ow && inc){ carry=Math.max(0,b); lastPay=t.date; } }
  return {bal:b, carry, lastPay, n:ev.length};
}
const walBal=w=>walInfo(w).bal;
/* ---------- 투자 성과: 넣은 돈(원금) vs 평가금액 ----------
   원금 = 기준 원금(invPrincipal, invFrom 시점) + 그 뒤 이 지갑으로 들어온 이체 − 나간 이체. 평가금액 = 지갑 잔액(잔액 맞추기로 갱신) */
const isInv=w=>!!w && walGroup(w)==='투자' && !w.closed;
/* 종목별 기록: holdings=[{id,name,cost(매수금액),value(평가금액),upd}] · 예수금은 직접 적거나(cash) 비우면 넣은 돈 − 매수금액 합으로 자동 */
function holdSum(w){ const hs=w.holdings||[]; const cost=hs.reduce((a,h)=>a+(+h.cost||0),0), value=hs.reduce((a,h)=>a+(+h.value||0),0);
  let cash=w.cash; if(cash==null){ const save=w.holdings; w.holdings=null; const i=invInfoRaw(w); w.holdings=save; cash=Math.max(0,(i?i.principal:0)-cost); }
  const upd=hs.map(h=>h.upd||'').sort().pop()||''; return {cost,value,cash:+cash||0,upd}; }
function invInfo(w){ const r=invInfoRaw(w); if(r && w.holdings?.length){ const h=holdSum(w); r.value=h.value+h.cash; r.gain=r.value-r.principal; r.pct=r.principal>0? r.gain/r.principal*100 : null; r.asOf=h.upd||r.asOf; r.hs=w.holdings; r.cash=h.cash; } return r; }
function invInfoRaw(w){
  const bal=w.holdings?.length? 0 : walBal(w); if(bal==null) return null;
  const from=w.invFrom||w.baseDate||'', fts=w.invTs??w.baseTs??0;
  let p=w.invPrincipal!=null? w.invPrincipal : (w.balance||0);
  const after=t=> !from || t.date>from || (t.date===from && (t.ts||0)>fts);
  for(const t of allTx()){ if(!isX(t) || t.date>todayStr() || !after(t)) continue; if(t.to===w.id) p+=Math.abs(t.amt); else if(t.wallet===w.id) p-=Math.abs(t.amt); }
  const gain=bal-p; return {principal:p, value:bal, gain, pct: p>0? gain/p*100 : null, asOf: w.checked||w.baseDate||''};
}
/* 투자 지갑은 잔액을 다시 맞춰도 원금 기준이 흔들리지 않게, 처음 한 번 원금 기준을 고정해 둬요 */
function freezeInv(w){ if(isInv(w) && w.invPrincipal==null){ const i=invInfo(w); if(i){ w.invPrincipal=i.principal; w.invFrom=todayStr(); w.invTs=Date.now(); } } return w; }
const gainCls=g=> g>0?'c-up':g<0?'c-down':'';
const gainTxt=(g,pct)=>`${g>0?'+':g<0?'−':''}${won(Math.abs(g))}${pct!=null?` (${g>0?'+':g<0?'−':''}${Math.abs(pct).toFixed(1)}%)`:''}`;

/* ---------- store ---------- */
let pending=0;
function setStatus(txt,err){const el=$('#status'); el.textContent=txt; el.classList.toggle('err',!!err);}
async function writeDoc(path,data){
  if(!S.db){ setStatus('저장소 연결 없음',true); throw new Error('no db'); }
  pending++; setStatus('저장 중…');
  try{ await S.db.doc(path).set(data); pending--; if(!pending) setStatus('저장됨'); }
  catch(e){ pending--; if(e?.code==='invalid_argument'){S.writable=false;} setStatus(e?.code==='quota_exceeded'?'저장 공간이 가득 찼어요':'저장하지 못했어요',true); throw e; }
}
/* 저장 중인 달은 서버 스냅샷이 덮어쓰지 않게 표시해 둬요 (달을 옮길 때 내역이 사라지던 문제) */
const PEND=new Map();
const saveMonth=ym=>{ PEND.set(ym,(PEND.get(ym)||0)+1); const data={month:ym,items:(S.months[ym]||[]).map(x=>({...x}))};
  return writeDoc('tx/'+ym,data).finally(()=>{ const n=(PEND.get(ym)||1)-1; if(n>0) PEND.set(ym,n); else PEND.delete(ym); }); };
const saveMonths=ks=>Promise.all([...ks].map(k=>saveMonth(k).catch(()=>{})));
const saveMeta=(name,obj)=>writeDoc('meta/'+name,obj);

async function boot(){
  const db = window.claude?.use ? await window.claude.use('db') : null;
  if(!db){ $('#boot').innerHTML='이 화면에서는 가계부 저장소에 연결할 수 없어요.<br>claude.ai에 로그인한 상태에서 이 페이지를 열어 주세요.'; return; }
  S.db=db;
  try{ const user=await window.claude.use('user'); const w=user? await user.can('data.write'):null; if(w===false) S.writable=false; }catch(e){}
  db.collection('tx').limit(1000).onSnapshot(snap=>{
    const m={}; for(const d of snap.docs){ const v=d.data(); if(v&&Array.isArray(v.items)) m[d.id]=v.items.map(x=>({...x})); }
    for(const k of PEND.keys()) if(S.months[k]) m[k]=S.months[k];
    S.months=m; S.loaded.tx=true; render();
  }, e=>setStatus('불러오기 실패: '+e.code,true));
  db.collection('meta').onSnapshot(snap=>{
    for(const d of snap.docs){ const v=d.data()||{};
      if(d.id==='settings') S.settings={food:{},foodDefault:0,groups:[],...JSON.parse(JSON.stringify(v))};
      else if(['categories','wallets','fixed','stats','recurring'].includes(d.id)){ const key=d.id==='categories'?'cats':d.id==='recurring'?'routines':d.id; S[key]=(v.items||[]).map(x=>({...x})); }
    }
    S.cats.sort((a,b)=>(a.order??0)-(b.order??0)); S.wallets.sort((a,b)=>(a.order??0)-(b.order??0));
    S.loaded.meta=true; render();
  }, e=>setStatus('불러오기 실패: '+e.code,true));
}

/* ---------- 묶음 + 끌어서 순서 바꾸기 (루틴 · 지갑 · 카테고리) ---------- */
const RT_GROUPS=['수입','이체·자동이체','저축','대출·보험','공과금·통신','구독','모임·회비','기타'];
const WAL_GROUPS=['우리은행','카카오뱅크','기타 은행','카드','저축','투자','대출','페이·포인트·현금','기타'];
const isLoan=w=>w?.kind==='loan';
function rtGroup(r){ if(r.grp) return r.grp; if(r.kind==='이체') return walById(r.to)?.saving?'저축':'이체·자동이체'; const c=catById(r.cat); const n=c?.name||'';
  if(c?.type==='수입'||r.amt>0) return '수입'; if(c?.type==='저축') return '저축'; if(n==='구독'||n==='업무') return '구독'; if(n==='주거/통신') return '공과금·통신'; if(n==='고정지출'||n==='대출이자'||n==='보험') return '대출·보험'; if(n==='모임') return '모임·회비'; return '기타'; }
function walGroup(w){ if(w.grp) return w.grp; if(isLoan(w)) return '대출'; const n=w.name||'';
  if(/^카카오뱅크/.test(n)) return '카카오뱅크'; if(/^우리은행/.test(n)) return '우리은행'; if(/카드/.test(n)) return '카드'; if(/ISA|증권|주식|투자|펀드|연금/.test(n)) return '투자'; if(/적금|청약|예금/.test(n)) return '저축'; if(/은행|IBK|기업|농협|국민|신한|하나|토스뱅크|케이뱅크|SC|씨티|새마을|우체국/.test(n)) return '기타 은행'; if(/페이|포인트|현금/.test(n)) return '페이·포인트·현금'; return '기타'; }
function catGroupKey(c){ return c.type==='지출'? '지출|'+(c.group||'') : c.type+'|'; }
function catGroupKeys(){ const ks=['수입|',...(S.settings.groups||[]).map(g=>'지출|'+g),'지출|','저축|','송금|']; for(const c of S.cats){ const k=catGroupKey(c); if(!ks.includes(k)) ks.push(k);} return ks; }
const catGroupTitle=k=>{ const [t,g]=k.split('|'); return t==='지출'? (g?`지출 · ${g}`:'지출 · 묶음 없음') : t; };
const ORD={
  rt:{list:()=>S.routines,set:v=>S.routines=v,group:rtGroup,setGroup:(x,g)=>x.grp=g,groups:()=>[...new Set([...RT_GROUPS,...S.routines.map(rtGroup)])],key:x=>x.order??(1000+(+x.day||0)),save:()=>saveRoutines()},
  wal:{list:()=>S.wallets,set:v=>S.wallets=v,group:walGroup,setGroup:(x,g)=>x.grp=g,groups:()=>[...new Set([...WAL_GROUPS,...S.wallets.map(walGroup)])],key:x=>x.order??1000,save:()=>saveMeta('wallets',{items:S.wallets})},
  cat:{list:()=>S.cats,set:v=>S.cats=v,group:catGroupKey,setGroup:(x,k)=>{const [t,g]=k.split('|'); if(t===x.type&&t==='지출') x.group=g;},groups:catGroupKeys,key:x=>x.order??1000,save:()=>saveMeta('categories',{items:S.cats}),
       allow:(x,k)=>k.split('|')[0]===x.type}
};
function grouped(kind){ const o=ORD[kind]; const by={}; for(const x of o.list()) (by[o.group(x)]=by[o.group(x)]||[]).push(x);
  return o.groups().filter(g=>by[g]?.length).map(g=>[g,by[g].slice().sort((a,b)=>o.key(a)-o.key(b))]); }
function moveItem(kind,dragId,targetId,targetGroup){
  const o=ORD[kind]; if(kind==='cat') o.set(o.list().map(x=>x.color?x:{...x,color:catColor(x)})); // 순서가 바뀌어도 태그 색 유지
  const items=o.list(); const d=items.find(x=>x.id===dragId); if(!d) return;
  const t=targetId?items.find(x=>x.id===targetId):null; const g=t?o.group(t):targetGroup; if(!g) return;
  if(o.allow && !o.allow(d,g)) return;
  const flat=[]; for(const [gk,xs] of grouped(kind)) for(const x of xs) if(x.id!==dragId) flat.push(x);
  const nd={...d}; o.setGroup(nd,g);
  let idx = t? flat.findIndex(x=>x.id===t.id) : (()=>{ let last=-1; flat.forEach((x,i)=>{ if(o.group(x)===g) last=i; }); if(last>=0) return last+1; const gs=o.groups(); const gi=gs.indexOf(g); let pos=flat.length; for(let i=0;i<flat.length;i++){ if(gs.indexOf(o.group(flat[i]))>gi){pos=i;break;} } return pos; })();
  if(idx<0) idx=flat.length;
  flat.splice(idx,0,nd);
  const ord=new Map(flat.map((x,i)=>[x.id,i]));
  o.set(items.map(x=>x.id===dragId? {...nd,order:ord.get(x.id)} : {...x,order:ord.get(x.id)}));
  render(); o.save().catch(()=>{});

async function shiftTx(ids, offset, copy){
  if(!offset && !copy) return;
  const touched=new Set(); const made=[];
  for(const id of ids){ const hit=findTx(id); if(!hit) continue; const nd=addDays(hit.t.date,offset);
    if(copy){ const c={...hit.t,id:uid()+made.length,date:nd,ts:Date.now()+made.length}; delete c.rid; delete c.rym; delete c.grp; delete c.pay; delete c.months; delete c.free; if(c.bm) delete c.bm; made.push(c); }
    else { S.months[hit.k]=S.months[hit.k].filter(x=>x.id!==id); touched.add(hit.k); made.push({...hit.t,date:nd}); } }
  for(const t of made){ const k=ymOf(t.date); (S.months[k]=S.months[k]||[]).push(t); S.months[k].sort((a,b)=>a.date.localeCompare(b.date)); touched.add(k); }
  S.sel=new Set(); render();
  setStatus(copy?`${made.length}건 복사함`:`${made.length}건 옮김`);
  await saveMonths(touched);
}

/* ---------- 잔액 맞추기 (짤짤이 이자·캐시백을 한 줄로) ---------- */
function ensureCat(name,type,group){ let c=S.cats.find(x=>x.name===name); if(!c){ c={id:'c'+uid(),name,type,group:type==='지출'?(group||'기타'):'',food:false,order:S.cats.length,color:'gray'}; S.cats=[...S.cats,c]; saveMeta('categories',{items:S.cats}).catch(()=>{}); } return c; }
function openRecon(wid){
  const w=walById(wid); if(!w) return; const k=walKind(w), cc=k==='card', od=k==='od';
  const cur=walBal(w); const shown=cur==null?null:(od?Math.abs(cur):cur);
  const label=cc?'카드사 앱의 갚을 돈':od?'은행 앱의 사용한 금액':'은행 앱의 실제 잔액';
  sheet(`<div class="peek-title">${esc(w.name)} <span class="faint" style="font-size:15px;font-weight:500">잔액 맞추기</span></div>

    ${prop('#',label,'rc-v',`<input id="rc-v" class="num" inputmode="numeric" placeholder="숫자만 입력" autocomplete="off">`)}
    <div class="note" id="rc-note" style="margin-top:10px">${cc?'카드사 앱에 보이는 갚을 돈(이번 달 사용 + 결제 예정)을 넣어요.':'은행 앱을 열었을 때 보이는 금액을 그대로 넣어요.'}</div>
    <label class="muted" style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px"><input type="checkbox" id="rc-rec" checked style="width:16px;height:16px">차액을 내역으로 남기기 (이자·캐시백은 기타 수입으로 잡혀요)</label>
    <div class="peek-actions"><button class="btn" id="cancel">취소</button><button class="btn pri" id="ok">맞추기</button></div>`,
  s=>{ const q=x=>s.querySelector(x); q('#cancel').addEventListener('click',close);
    const calc=()=>{ const raw=q('#rc-v').value.trim(); if(raw==='') return null; const a=Math.abs(num(raw));
      const nb= cc? a : od? -a : (raw.trim().startsWith('-')?-a:a);

        : `실제가 <b class="c-warn">${won(-c.gain)}원</b> 부족해요 → 빠뜨린 지출이 있을 수 있어요. <b>잔액 맞춤 (기록 안 된 지출)</b>로 기록해요.`; };

      }

/* ---------- 폰: 키패드 밖을 한 번 터치하면 키패드만 닫기 (다른 칸이 눌리지 않게) ---------- */
document.addEventListener('touchstart',e=>{
  const a=document.activeElement; if(!a||!a.matches||!a.matches('input:not([type=checkbox]):not([type=radio]):not([type=date]):not([type=month]),textarea')) return;
  if(a===e.target||a.contains(e.target)) return;
  const ctl=e.target.closest&&e.target.closest('input,select,textarea,label,.prop');
  if(ctl){ e.preventDefault(); }   // 다른 입력칸이 대신 눌리지 않게

},{capture:true,passive:false});

{ let sx=0, sy=0, st=0, mode='';

{ let lpT=null, lpX=0, lpY=0, lpFired=false, lpAt=0;
  // 손을 떼는 순간 메뉴의 첫 항목(열기)이 눌리지 않게, 메뉴가 뜬 직후의 터치·클릭은 무시해요
  document.addEventListener('click',e=>{ if(Date.now()-(window.__lpAt||0)<600){ e.preventDefault(); e.stopPropagation(); } },true);
  const cancel=()=>{ clearTimeout(lpT); lpT=null; };
  $('#main').addEventListener('touchstart',e=>{ if(e.touches.length!==1) return; const t=e.target.closest('[data-tx],[data-draft],[data-cell],[data-day]'); if(!t||e.target.closest('input,textarea,select')) return;
    lpX=e.touches[0].clientX; lpY=e.touches[0].clientY; lpFired=false; cancel();
    lpT=setTimeout(()=>{ lpT=null; lpFired=true; const tgt=document.elementFromPoint(lpX,lpY)||t; navigator.vibrate?.(15);
      window.__lpAt=Date.now(); tgt.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:lpX,clientY:lpY+14}));
      const m=document.getElementById('ctx'); if(m){ m.style.pointerEvents='none'; setTimeout(()=>{ m.style.pointerEvents=''; },600); } },480); },{passive:true});

/* ---------- side peek ---------- */
function sheet(html, onMount){
  $('#sheetRoot').innerHTML=`<div class="scrim" id="scrim"><div class="peek" role="dialog" aria-modal="true">
    <div class="peek-top"><button class="ghost" id="peekClose" aria-label="닫기">✕</button><span class="faint" style="font-size:12.5px">Esc로 닫기</span></div>
    <div class="peek-body">${html}</div></div></div>`;
  const sc=$('#scrim'); sc.addEventListener('click',e=>{ if(e.target===sc) close(); });
  $('#peekClose').addEventListener('click',close);
  document.addEventListener('keydown',escClose);
  onMount&&onMount(sc.querySelector('.peek'));
  const f=sc.querySelector('.peek-title,input,select'); f&&f.focus();
}
function escClose(e){ if(e.key==='Escape') close(); }
function close(){ $('#sheetRoot').innerHTML=''; document.removeEventListener('keydown',escClose); }
const val=(s,id)=>s.querySelector('#'+id)?.value;
const num=v=>{const n=Number(String(v??'').replace(/[^\d.-]/g,'')); return isFinite(n)?n:0;};
const prop=(icon,label,id,control)=>`<div class="prop"><label for="${id}"><span class="pi">${icon}</span>${label}</label>${control}</div>`;
const actions=(canDelete,okLabel)=>`<div class="peek-actions">${canDelete?'<button class="btn danger l" id="del">삭제</button>':''}<button class="btn" id="cancel">취소</button><button class="btn pri" id="ok">${okLabel||'저장'}</button></div>`;
function confirmDelete(s, fn){
  const b=s.querySelector('#del'); if(!b) return;
  b.addEventListener('click',()=>{ if(b.dataset.armed){ fn(b); } else { b.dataset.armed=1; b.textContent='한 번 더 누르면 삭제돼요'; } });
}
const catOptions=sel=>['수입','지출','저축','송금'].map(ty=>`<optgroup label="${ty}">${S.cats.filter(c=>c.type===ty).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
function favWallets(){ const from=addMonths(ymOf(todayStr()),-3)+'-01', c={}; for(const t of allTx()) if(t.date>=from && t.wallet && !isX(t)) c[t.wallet]=(c[t.wallet]||0)+1;
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).filter(id=>walById(id)); }
const walOptions=sel=>{ const fav=favWallets(); const o=w=>`<option value="${w.id}" ${w.id===sel?'selected':''}>${esc(w.name)}</option>`;
  return `<option value="">비어 있음</option>`+(fav.length?`<optgroup label="자주 쓰는 지갑">${fav.map(id=>o(walById(id))).join('')}</optgroup><optgroup label="전체">`:'')+S.wallets.filter(w=>!fav.includes(w.id)&&(!w.closed||w.id===sel)).map(o).join('')+(fav.length?'</optgroup>':''); };
/* 내역 이름으로 카테고리·지갑 추천: 과거 기록에서 같은/비슷한 이름을 찾아 가장 많이 쓴 걸 골라요 */
let GIDX=null, GIDXn=-1;
const gTok=n=>String(n||'').replace(/\(\d+\/\d+\)/g,'').toLowerCase().split(/[\s\-–·,()\/+_:]+/).filter(x=>x.length>=2);
function guessIdx(){ const all=allTx(); if(GIDX&&GIDXn===all.length) return GIDX; const ex={}, tk={}, rows=[];
  const add=(m,k,t)=>{ const o=m[k]||(m[k]={c:{},w:{}}); o.c[t.cat]=(o.c[t.cat]||0)+1; if(t.wallet) o.w[t.wallet]=(o.w[t.wallet]||0)+1; if(t.wallet&&(!o.ld||t.date>=o.ld)){ o.ld=t.date; o.lw=t.wallet; } };
  for(const t of all){ if(isX(t)||t.draft||!t.cat||!catById(t.cat)) continue; if(/^잔액 맞춤|정산 차액/.test(t.name||'')) continue; const n=normName(t.name); if(!n) continue;
    add(ex,n,t); for(const k of new Set(gTok(t.name))) add(tk,k,t); rows.push([n,t]); }
  GIDX={ex,tk,rows}; GIDXn=all.length; return GIDX; }
function guessFor(name){ const n=normName(name); if(n.length<1) return null; const I=guessIdx(); const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';
  if(I.ex[n]) return {cat:top(I.ex[n].c),wallet:I.ex[n].lw||top(I.ex[n].w),sure:true}; // 지갑은 가장 최근에 쓴 것
  const c={}, w={}; for(const k of gTok(name)){ const o=I.tk[k]; if(!o) continue; for(const [a,v] of Object.entries(o.c)) c[a]=(c[a]||0)+v; for(const [a,v] of Object.entries(o.w)) w[a]=(w[a]||0)+v; }
  if(!Object.keys(c).length && n.length>=2){ for(const [rn,t] of I.rows){ if(rn.startsWith(n)||rn.includes(n)){ c[t.cat]=(c[t.cat]||0)+1; if(t.wallet) w[t.wallet]=(w[t.wallet]||0)+1; } } }
  if(!Object.keys(c).length) return null; return {cat:top(c),wallet:top(w),sure:false}; }

function findTx(id){ for(const [k,arr] of Object.entries(S.months)){ const i=arr.findIndex(t=>t.id===id); if(i>=0) return {k,i,t:arr[i]}; } return null; }

    q('#ok').addEventListener('click',async()=>{

          if(!ac){ ac={id:'c'+uid(),name:'카드 정산 차액',type:'지출',group:'기타',food:false,order:S.cats.length,color:'gray'}; S.cats=[...S.cats,ac]; saveMeta('categories',{items:S.cats}).catch(()=>{}); }
          rows.push({id:uid()+'a',name:`${tw.name} 정산 차액`,date:addDays(date.slice(0,7)+'-01',-1),amt:-d,cat:ac.id,wallet:to,memo:`가계부 ${won(due)}원 → 카드사 확정 ${won(amt)}원`}); }

          memo:base.memo||`${p.total.toLocaleString('ko-KR')}원 ${p.n}개월 할부${p.free?' (무이자)':''}`, ...(x.k===0?{pay:sign*p.total,months:p.n,free:p.free}:{})});
      } else {
        const r={...t,...base,amt:sign*amt}; delete r.bm; delete r.kind; delete r.to; delete r.pts; delete r.ptWallet; delete r.cur; delete r.fx;
        { const fx=getFx(); if(fx && fx.fx>0){ r.cur=fx.cur; r.fx=fx.fx; } }
        { const p=Math.abs(num(val(s,'f-pts'))); const pw=S.wallets.find(w=>/M\s*포인트/.test(w.name)); if(p && !q('#rowPts').hidden && pw){ r.pts=p; r.ptWallet=pw.id; } }

    s.querySelector('#ok').addEventListener('click',()=>{ const nm=val(s,'c-name').trim(); if(!nm) return s.querySelector('#c-name').focus();
      Object.assign(c,{name:nm,type:val(s,'c-type'),group:val(s,'c-grp'),color:val(s,'c-col'),food:s.querySelector('#c-food').checked});
      const i=S.cats.findIndex(x=>x.id===c.id); if(i>=0) S.cats[i]=c; else S.cats.push(c);
      close(); render(); saveMeta('categories',{items:S.cats}).catch(()=>{}); }); });
}
function openFixed(id){

   ${prop('◷','Start','x-s',`<input id="x-s" type="date" value="${f.start||''}">`)}
   ${prop('▾','은행','x-b',`<input id="x-b" list="xb" value="${esc(f.bank||'')}" placeholder="비어 있음"><datalist id="xb">${banks.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>`)}
   ${prop('▾','카테고리','x-c',`<input id="x-c" list="xc" value="${esc(f.cat||'')}" placeholder="비어 있음"><datalist id="xc">${cats.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>`)}
   ${prop('☑','연결제','x-y',`<input type="checkbox" id="x-y" ${f.yearly?'checked':''}>`)}
   <div class="note" style="margin-top:8px">1년에 한 번 결제하는 항목도 월간에는 1/12 금액을 적어요.</div>
   ${actions(!!id)}`,
  s=>{ s.querySelector('#cancel').addEventListener('click',close);
    confirmDelete(s,()=>{ S.fixed=S.fixed.filter(x=>x.id!==id); close(); render(); saveMeta('fixed',{items:S.fixed}).catch(()=>{}); });
    s.querySelector('#ok').addEventListener('click',()=>{ const nm=val(s,'x-name').trim(); if(!nm) return s.querySelector('#x-name').focus();
      Object.assign(f,{name:nm,monthly:Math.abs(num(val(s,'x-m'))),start:val(s,'x-s'),bank:val(s,'x-b').trim(),cat:val(s,'x-c').trim(),yearly:s.querySelector('#x-y').checked});
      const i=S.fixed.findIndex(x=>x.id===f.id); if(i>=0) S.fixed[i]=f; else S.fixed.push(f);
      close(); render(); saveMeta('fixed',{items:S.fixed}).catch(()=>{}); }); });
}
function openStat(id){
  const t=totals(monthTx(S.ym));
  const r=id?{...S.stats.find(x=>x.id===id)}:{id:uid(),date:todayStr(),income:t.수입,expense:Math.abs(t.지출),saving:Math.abs(t.저축),note:''};
  sheet(`<input class="peek-title" id="s-n" value="${esc(r.note||'')}" placeholder="etc (메모)" aria-label="메모">
   ${id?'':`<div class="note" style="margin-bottom:6px">${ymLabel(S.ym)} 내역에서 계산한 값으로 채웠어요. 필요하면 고쳐서 저장하세요.</div>`}
   ${prop('◷','날짜 1','s-d',`<input id="s-d" type="date" value="${r.date}">`)}
   ${prop('#','수입','s-i',`<input id="s-i" class="num" inputmode="numeric" value="${r.income}">`)}
   ${prop('#','지출','s-e',`<input id="s-e" class="num" inputmode="numeric" value="${r.expense}">`)}
   ${prop('#','저축','s-s',`<input id="s-s" class="num" inputmode="numeric" value="${r.saving}">`)}
   ${actions(!!id)}`,
  s=>{ s.querySelector('#cancel').addEventListener('click',close);
    confirmDelete(s,()=>{ S.stats=S.stats.filter(x=>x.id!==id); close(); render(); saveMeta('stats',{items:S.stats}).catch(()=>{}); });
    s.querySelector('#ok').addEventListener('click',()=>{ Object.assign(r,{date:val(s,'s-d'),income:num(val(s,'s-i')),expense:num(val(s,'s-e')),saving:num(val(s,'s-s')),note:val(s,'s-n').trim()});
      const i=S.stats.findIndex(x=>x.id===r.id); if(i>=0) S.stats[i]=r; else S.stats.push(r);
      close(); render(); saveMeta('stats',{items:S.stats}).catch(()=>{}); }); });
}
function openFood(){
  const fp=foodPlan(S.ym);
  sheet(`<div class="peek-title" style="cursor:default">${ymLabel(S.ym)} 식비 예산</div>
   ${prop('#','이달의 식비','b-v',`<input id="b-v" class="num" inputmode="numeric" value="${fp.budget||''}" placeholder="비어 있음">`)}
   ${prop('☑','기본값으로','b-def',`<label class="muted" style="display:flex;gap:8px;align-items:center;font-size:13px;padding:6px"><input type="checkbox" id="b-def" style="width:16px;height:16px">예산을 따로 정하지 않은 달에도 쓰기</label>`)}
   ${actions(false)}`,
  s=>{ s.querySelector('#cancel').addEventListener('click',close);
    s.querySelector('#ok').addEventListener('click',()=>{ const v=Math.abs(num(val(s,'b-v'))); const st=JSON.parse(JSON.stringify(S.settings)); st.food=st.food||{}; st.food[S.ym]=v; if(s.querySelector('#b-def').checked) st.foodDefault=v; S.settings=st; close(); render(); saveMeta('settings',st).catch(()=>{}); }); });
}

/* ---------- export ---------- */
async function download(kind){
  const msg=$('#dlMsg'); const dl=await window.claude?.use?.('downloads');
  if(!dl){ msg.textContent='이 화면에서는 파일을 내려받을 수 없어요.'; return; }
  const stamp=todayStr();
  let filename, data;
  if(kind==='json'){ filename=`가계부-백업-${stamp}.json`; data=JSON.stringify({exportedAt:new Date().toISOString(),categories:S.cats,wallets:S.wallets,fixed:S.fixed,stats:S.stats,settings:S.settings,transactions:allTx()},null,1); }
  else { const q=v=>{v=String(v??''); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
    const rows=[['결제일','결제내역','금액','분류','카테고리','지갑','메모','귀속월','할부결제액','개월수','무이자','월납입금','총이자']];
    for(const t of allTx()){ const i=t.pay?installment(t.pay,t.months,t.free):null; rows.push([t.date,t.name,t.amt,typeOf(t),isX(t)?'→ '+(walById(t.to)?.name||''):(catById(t.cat)?.name||''),walById(t.wallet)?.name||'',t.memo||'',t.bm||'',t.pay??'',t.months??'',t.pay?(t.free?'Y':'N'):'',i?-i.monthly:'',i?i.interest:'']); }
    filename=`가계부-거래내역-${stamp}.csv`; data='﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'); }
  try{ await dl.save({filename,data}); msg.textContent='파일을 저장했어요.'; }
  catch(e){ msg.textContent= e?.code==='declined'?'저장을 취소했어요.':'파일을 만들지 못했어요 ('+(e?.code||'오류')+').'; }
}

boot();
})();
</script>
